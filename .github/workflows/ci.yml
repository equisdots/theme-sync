name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Palette data + schema live in their own repo; CI uses a checkout.
      - uses: actions/checkout@v4
        with:
          repository: equisdots/palettes
          path: palettes

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile package
        run: python3 -m compileall -q themesync

      - name: CLI smoke test (list + dry-run, without writing anything)
        run: |
          printf '{"dock":{"palette":"x"}}\n' > /tmp/settings.json
          ./theme-sync.sh --list --palettes palettes --settings /tmp/settings.json
          ./theme-sync.sh --dry-run --palettes palettes --settings /tmp/settings.json
